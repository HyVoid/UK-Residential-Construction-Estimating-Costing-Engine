name: Deploy Costing Engine to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Disabled npm Cache Setup: Removed the cache parameter to prevent:
          # "Dependencies lock file is not found in /home/runner/work/. Supported file patterns: package-lock.json,npm-shrinkwrap.json,yarn.lock"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        # Vite base: './' is configured in vite.config.ts to produce clean relative resource URLs for GitHub Pages
        run: npm run build

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Automated deploy via GitHub Actions"
